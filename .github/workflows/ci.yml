name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
        env:
          OMP_NUM_THREADS: "1"
